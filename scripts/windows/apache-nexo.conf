# ============================================================================
# NEXO detrás de Apache (XAMPP)
# ----------------------------------------------------------------------------
# Apache es la puerta de entrada: recibe a todos por HTTPS (puerto 443) y le
# pasa cada pedido a NEXO, que escucha solo en la propia máquina (127.0.0.1:3073).
#
# Cómo usarlo:
#   1. Copiá este archivo a  C:\xampp\apache\conf\extra\nexo.conf
#   2. Cambiá las tres líneas "Define" de abajo.
#   3. Al final de  C:\xampp\apache\conf\httpd.conf  agregá:
#        Include conf/extra/nexo.conf
#   4. Reiniciá Apache desde el XAMPP Control Panel.
# NEXO tiene que tener su PROPIA dirección (por ejemplo nexo.miescuela.edu.ar):
# no funciona dentro de una subcarpeta como miescuela.edu.ar/nexo.
# ============================================================================

# ── Lo que hay que completar ────────────────────────────────────────────────
# La dirección con la que se entra a NEXO.
Define NEXO_DOMINIO nexo.miescuela.edu.ar
# El certificado HTTPS: el archivo con el certificado (y su cadena) y su clave.
# Rutas con / y sin espacios.
# Con win-acme (Let's Encrypt) son los archivos "...-chain.pem" y "...-key.pem".
Define NEXO_CERTIFICADO C:/nexo-datos/certificados/nexo.miescuela.edu.ar-chain.pem
Define NEXO_CLAVE C:/nexo-datos/certificados/nexo.miescuela.edu.ar-key.pem

# ── Módulos de Apache que hacen falta (se cargan si no lo estaban) ──────────
<IfModule !proxy_module>
  LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
  LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !proxy_wstunnel_module>
  LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>
<IfModule !headers_module>
  LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !ssl_module>
  LoadModule ssl_module modules/mod_ssl.so
</IfModule>
<IfModule !socache_shmcb_module>
  LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
</IfModule>

# ── http:// → https:// ──────────────────────────────────────────────────────
# Todo lo que llega sin cifrar se manda a la versión segura. La única excepción
# es la carpeta que usa Let's Encrypt (win-acme) para comprobar el dominio.
<VirtualHost *:80>
  ServerName ${NEXO_DOMINIO}
  DocumentRoot "C:/nexo-datos/acme"
  <Directory "C:/nexo-datos/acme">
    Require all granted
  </Directory>
  RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)$" "https://${NEXO_DOMINIO}/$1"
</VirtualHost>

# ── https:// → NEXO ─────────────────────────────────────────────────────────
# XAMPP ya escucha en el 443 (conf/extra/httpd-ssl.conf): no se repite acá.
<VirtualHost *:443>
  ServerName ${NEXO_DOMINIO}

  SSLEngine on
  SSLCertificateFile "${NEXO_CERTIFICADO}"
  SSLCertificateKeyFile "${NEXO_CLAVE}"
  SSLProtocol -all +TLSv1.2 +TLSv1.3

  ProxyRequests Off
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"

  # Lo "en vivo" (mensajes, avisos, clases): WebSocket en /ws. Va antes que "/".
  ProxyPass        /ws ws://127.0.0.1:3073/ws
  ProxyPassReverse /ws ws://127.0.0.1:3073/ws

  # Todo lo demás: la aplicación y su API. 5 minutos de espera para subir videos.
  ProxyPass        / http://127.0.0.1:3073/ timeout=300
  ProxyPassReverse / http://127.0.0.1:3073/

  # Archivos de hasta 200 MB (los videos de la Comunidad llegan a 100 MB).
  LimitRequestBody 209715200

  # Los navegadores recuerdan que este sitio va siempre por HTTPS.
  Header always set Strict-Transport-Security "max-age=31536000"

  ErrorLog "logs/nexo-error.log"
  CustomLog "logs/nexo-acceso.log" common
</VirtualHost>
